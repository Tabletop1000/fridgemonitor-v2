<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fridge Monitor Wifi Selection</title>
<style>
body {
font-family: Arial, sans-serif;
margin: 0;
padding: 0;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
background-color: #f0f0f0;
}
#config-form {
text-align: center;
padding: 20px;
border: 1px solid #ccc;
border-radius: 8px;
background-color: #fff;
width: 400px;
}
input[type="submit"],
input[type="button"] {
width: 100%;
padding: 10px;
margin: 10px 0;
border: none;
border-radius: 5px;
background-color: #007bff;
color: #fff;
cursor: pointer;
}
#scan-button {
background-color: #0056b3;
}
#heading {
margin-bottom: 20px;
width: 100%;
}
.form-row {
display: flex;
justify-content: space-between;
align-items: center;
margin: 10px 0;
}
.form-row label {
width: 150px;
text-align: right;
margin-right: 10px;
white-space: nowrap;
}
.form-row input,
.form-row select {
flex: 2;
padding: 8px;
border: 1px solid #ccc;
border-radius: 4px;
}
#scan-results {
    text-align: center;
    margin-top: 10px;
}
#scan-results table {
    width: 100%;
    border-collapse: collapse;
}
#scan-results th, #scan-results td {
    border: 1px solid #ccc;
    padding: 8px;
}
#scan-results tr[data-ssid] {
    cursor: pointer;
}
#scan-results tr[data-ssid]:hover {
    background-color: #f5f8ff;
}
.section-title {
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px dashed #ccc;
    text-align: left;
    font-size: 15px;
    color: #333;
}
#status-message {
    margin-top: 15px;
    font-size: 14px;
    color: #333;
}
</style>
</head>
<body>

<form id="config-form">
<h3 id="heading">Fridge Monitor WiFi setup</h3>

<input type="button" value="Scan for networks" id="scan-button">
<div id="scan-results"></div>

<div class="form-row" style="margin-top: 20px;">
    <label for="ssid-input">SSID:</label>
    <input type="text" id="ssid-input" placeholder="Network name" autocomplete="off">
</div>

<div class="form-row">
    <label for="security-type">Security Type:</label>
    <select id="security-type">
        <option value="">Auto (From Scan)</option>
        <option value="Open">Open</option>
        <option value="WPA">WPA</option>
        <option value="WPA2">WPA2</option>
        <option value="Mixed Mode">WPA2-3</option>
        <option value="WPA3">WPA3</option>
    </select>
</div>

<div class="form-row">
    <label for="password-input">WiFi Password:</label>
    <input type="password" id="password-input" placeholder="Leave blank to keep current" autocomplete="off">
</div>

<div class="mqtt-section">
    <h4 class="section-title">MQTT Server Configuration</h4>
    <div class="form-row">
        <label for="mqtt-server">Server Address:</label>
        <input type="text" id="mqtt-server" placeholder="mqtt.example.com">
    </div>
    <div class="form-row">
        <label for="mqtt-username">Username:</label>
        <input type="text" id="mqtt-username" placeholder="MQTT username">
    </div>
    <div class="form-row">
        <label for="mqtt-password">Password:</label>
        <input type="password" id="mqtt-password" placeholder="Leave blank to keep current" autocomplete="off">
    </div>
</div>

<div class="device-information-section">
    <h4 class="section-title">Device Information</h4>
    <div class="form-row">
        <label for="device-id">Device ID:</label>
        <input type="text" id="device-id" placeholder="Example refridgeration unit">
    </div>
</div>
<input type="submit" value="Save Configuration" id="save-button">
<div id="status-message"></div>
</form>

<script>
// ---------------------------------------------------------------------
// Load current device configuration from the backend and pre-populate
// the form. Expects the device to serve a JSON object at GET /config,
// e.g.:
// {
//   "ssid": "MyHomeWifi",
//   "security_type": "WPA2",
//   "mqtt_server": "mqtt.example.com",
//   "mqtt_username": "fridge01"
// }
// Note: password fields are intentionally NOT pre-filled. The device
// should not send stored secrets back to the browser; instead, an
// empty password field means "keep the current password unchanged".
// ---------------------------------------------------------------------
function loadCurrentConfig() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/config', true);
    xhr.onload = function () {
        if (xhr.status === 200) {
            try {
                var cfg = JSON.parse(xhr.responseText);
                if (cfg.ssid) document.getElementById('ssid-input').value = cfg.ssid;
                if (cfg.security_type) document.getElementById('security-type').value = cfg.security_type;
                if (cfg.mqtt_server) document.getElementById('mqtt-server').value = cfg.mqtt_server;
                if (cfg.mqtt_username) document.getElementById('mqtt-username').value = cfg.mqtt_username;
                if (cfg.device_id) document.getElementById('device-id').value = cfg.device_id;
            } catch (e) {
                console.error('Failed to parse /config response', e);
            }
        }
    };
    xhr.send();
}

window.addEventListener('DOMContentLoaded', loadCurrentConfig);

// ---------------------------------------------------------------------
// Scan button: fetch nearby networks and render a clickable table.
// Clicking a row fills in the SSID + security type fields above,
// it does not submit anything on its own.
// ---------------------------------------------------------------------
document.getElementById('scan-button').addEventListener('click', function () {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/scan', true);
    xhr.onload = function () {
        if (xhr.status === 200) {
            var scanResults = JSON.parse(xhr.responseText);
            var scanResultsDiv = document.getElementById('scan-results');
            scanResultsDiv.innerHTML = '';

            var table = document.createElement('table');

            var headerRow = document.createElement('tr');
            ['SSID', 'Security Type', 'Channel', 'RSSI'].forEach(function (col) {
                var th = document.createElement('th');
                th.textContent = col;
                headerRow.appendChild(th);
            });
            table.appendChild(headerRow);

            scanResults.scan_results.forEach(function (result) {
                var row = document.createElement('tr');
                row.dataset.ssid = result.ssid;
                row.dataset.security = result.security_type;

                [result.ssid, result.security_type, result.channel, result.rssi].forEach(function (val) {
                    var td = document.createElement('td');
                    td.textContent = val;
                    row.appendChild(td);
                });

                row.addEventListener('click', function () {
                    document.getElementById('ssid-input').value = row.dataset.ssid;
                    document.getElementById('security-type').value = row.dataset.security;
                });

                table.appendChild(row);
            });

            scanResultsDiv.appendChild(table);
        }
    };
    xhr.send();
});

// ---------------------------------------------------------------------
// Single submit: gather every field and send them all in one request.
// ---------------------------------------------------------------------
document.getElementById('config-form').addEventListener('submit', function (event) {
    event.preventDefault();

    var ssid = document.getElementById('ssid-input').value.trim();
    if (!ssid) {
        alert('Please enter or select a network SSID.');
        return;
    }

    var data = {
        ssid: ssid,
        security_type: document.getElementById('security-type').value,
        passphrase: document.getElementById('password-input').value,
        mqtt: {
            server: document.getElementById('mqtt-server').value,
            username: document.getElementById('mqtt-username').value,
            password: document.getElementById('mqtt-password').value
        },
        device_id: document.getElementById('device-id').value
    };

    var statusDiv = document.getElementById('status-message');
    statusDiv.textContent = 'Saving...';

    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/config', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onload = function () {
        if (xhr.status === 200) {
            statusDiv.textContent = 'Configuration saved. Connecting...';
        } else {
            statusDiv.textContent = 'Error saving configuration.';
        }
    };
    xhr.onerror = function () {
        statusDiv.textContent = 'Error saving configuration.';
    };
    xhr.send(JSON.stringify(data));
});
</script>
</body>
</html>
